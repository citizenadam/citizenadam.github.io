name: judge-answers

# Answers the fixed role set with the live model and commits the result. The
# key is a repository secret, so it is available to this job and to nothing that
# runs in a browser.

on:
  push:
    paths:
      - "judge/state.mjs"
      - "judge/questions.mjs"
      - "judge/roles.mjs"
      - "judge/precompute.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ask the model
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node judge/precompute.mjs

      - name: Commit the answers
        run: |
          git config user.name "judge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/judge/precomputed.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Refresh judge answers"
            git push
          fi
