name = "hire-judge"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://citizenadam.github.io"
IP_DAILY_CAP = "25"
DAILY_CAP = "400"
MIN_GAP_MS = "60000"

# KV is optional. Without it the counters are per-isolate best effort.
# With it, per-visitor and daily caps actually hold.
#

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[observability]
enabled = true
